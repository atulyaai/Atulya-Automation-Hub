[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atulya-automation-hub"
dynamic = ["version"]
description = "Central orchestrator for all Atulya automation tools"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Atulya Labs"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click",
    "rich",
    "python-dotenv",
    "pyyaml",
    "jinja2",
    "requests",
    "schedule",
    "pydantic>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/atulya/atulya-automation-hub"
Repository = "https://github.com/atulya/atulya-automation-hub"

[project.scripts]
atulya = "atulya_automation_hub.cli:main"
atulya-hub = "atulya_automation_hub.cli:main"

[tool.setuptools.packages.find]
include = ["*"]

[tool.setuptools.dynamic]
version = {attr = "atulya_automation_hub.__version__"}

